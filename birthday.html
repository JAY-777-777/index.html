<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Amma</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      color: white;
      font-family: 'Arial', sans-serif;
    }

    #message {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3em;
      white-space: pre;
      opacity: 0;
      text-align: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>
  <div id="message"></div>

  <script>
    // Fireworks animation
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let fireworks = [];
    let particles = [];

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    class Firework {
      constructor() {
        this.x = random(100, canvas.width - 100);
        this.y = canvas.height;
        this.targetY = random(100, canvas.height / 2);
        this.speed = random(4, 7);
        this.radius = 2;
        this.color = `hsl(${Math.floor(Math.random() * 360)}, 100%, 50%)`;
      }

      update() {
        this.y -= this.speed;
        if (this.y <= this.targetY) {
          for (let i = 0; i < 100; i++) {
            particles.push(new Particle(this.x, this.y, this.color));
          }
          return false;
        }
        return true;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = 1;
        this.color = color;
        this.speedX = random(-3, 3);
        this.speedY = random(-3, 3);
        this.alpha = 1;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= 0.01;
        return this.alpha > 0;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    let fireworkInterval = setInterval(() => {
      fireworks.push(new Firework());
    }, 300);

    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      fireworks = fireworks.filter(fw => {
        fw.draw();
        return fw.update();
      });

      particles = particles.filter(p => {
        p.draw();
        return p.update();
      });

      requestAnimationFrame(animate);
    }

    animate();

    // After some time, show the message
    setTimeout(() => {
      clearInterval(fireworkInterval);
      setTimeout(() => {
        document.getElementById('message').style.opacity = 1;
        const message = "HAPPY BIRTHDAY AMMA";
        let i = 0;
        const interval = setInterval(() => {
          document.getElementById('message').textContent += message[i];
          i++;
          if (i >= message.length) clearInterval(interval);
        }, 200);
      }, 3000);
    }, 6000);
  </script>
</body>
</html>
